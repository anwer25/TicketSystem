{% extends 'base.html' %}

{% block content %}
<div class="flex items-center justify-center min-h-screen bg-gray-100">
    <div class="w-full max-w-md p-8 space-y-6 bg-white rounded-lg shadow-md">
        <h2 class="text-2xl font-bold text-center text-gray-800">Register</h2>
        <form method="post" class="space-y-4">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit"
                class="w-full px-4 py-2 text-white bg-blue-500 rounded hover:bg-blue-600">Register</button>
        </form>
        <p class="text-sm text-center text-gray-600">Already have an account? <a href="{% url 'login' %}"
                class="text-blue-500 hover:underline">Login here</a>.</p>
    </div>
</div>
{% endblock %}
